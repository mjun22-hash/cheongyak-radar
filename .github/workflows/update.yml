name: 청약 공고 갱신 및 Pages 배포

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *' # 매일 07:00 KST
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 공공데이터 갱신
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: npm run update:data
      - run: npm test
      - run: npm run build
      - name: 공개 데이터 변경 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/announcements.json data/homedubu.json
          git diff --cached --quiet || git commit -m "data: daily subscription update"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
